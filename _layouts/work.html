---
layout: default
---
<h1>{{ page.title }}</h1>
<p>{{ page.summary }}</p>
{% for p in page.photos %}
<img src="{{ p | relative_url }}" alt="{{ page.title }}" style="max-width:100%">
{% endfor %}
{% if page.youtube %}
<iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/{{ page.youtube }}" allowfullscreen></iframe>
{% endif %}
{% if page.manual %}
<p><a href="{{ page.manual | relative_url }}">マニュアル (PDF)</a></p>
{% endif %}
{{ content }}
